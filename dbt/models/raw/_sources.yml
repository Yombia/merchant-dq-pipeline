version: 2

# Raw layer = what the source delivered, loaded as TEXT by ingestion/load_raw.py.
# These tests profile ONE batch (filtered by var batch_date in dbt_project.yml)
# and only warn: their job is to measure and record defects, not to stop the pipeline.

sources:
  - name: raw
    schema: raw
    description: Exact copy of the daily landing files. All business columns are TEXT.
    tables:
      - name: orders
        columns:
          - name: order_id
            data_tests: [not_null, unique]
          - name: customer_id
            data_tests: [not_null]
          - name: order_status
            data_tests:
              - accepted_values_var:
                  arguments: {var_name: order_statuses}
          - name: order_purchase_timestamp
            data_tests: [not_null, valid_timestamp]

      - name: order_items
        data_tests:
          - unique_combination:
              arguments:
                columns: [order_id, order_item_id]
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: product_id
            data_tests: [not_null]
          - name: seller_id
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'sellers')
                    field: seller_id
          - name: price
            data_tests: [not_null, non_negative_number]
          - name: freight_value
            data_tests: [non_negative_number]

      - name: payments
        data_tests:
          - unique_combination:
              arguments:
                columns: [order_id, payment_sequential]
        columns:
          - name: order_id
            data_tests: [not_null]
          - name: payment_type
            data_tests:
              - accepted_values_var:
                  arguments: {var_name: payment_types}
          - name: payment_value
            data_tests: [not_null, non_negative_number]

      - name: customers
        columns:
          - name: customer_id
            data_tests: [not_null, unique]
          - name: customer_unique_id
            data_tests: [not_null]

      - name: sellers
        columns:
          - name: seller_id
            data_tests: [not_null, unique]
          - name: seller_state
            data_tests:
              - accepted_values_var:
                  arguments: {var_name: br_states}

      - name: products
        columns:
          - name: product_id
            data_tests: [not_null, unique]
