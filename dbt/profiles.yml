merchant_dq:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DWH_HOST', 'localhost') }}"
      port: "{{ env_var('DWH_PORT', '5432') | as_number }}"
      user: "{{ env_var('DWH_USER', 'dwh') }}"
      password: "{{ env_var('DWH_PASSWORD', 'dwh') }}"
      dbname: "{{ env_var('DWH_DB', 'dwh') }}"
      schema: public
      threads: 4
