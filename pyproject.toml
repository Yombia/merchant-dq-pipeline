[project]
name = "merchant-dq-pipeline"
version = "0.1.0"
description = "Daily merchant data pipeline with layered data quality checks (Airflow + dbt + Postgres)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E702"]
